<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Welcome to My App</title>
  <style>
    :root {
      --primary: #4f46e5;
      --secondary: #7c3aed;
      --text: #1f2937;
      --muted: #64748b;
      --surface: rgba(255, 255, 255, 0.88);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(196, 181, 253, .65), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(147, 197, 253, .65), transparent 32%),
        linear-gradient(135deg, #f5f3ff, #eff6ff);
      display: flex;
      flex-direction: column;
    }

    header {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -.03em;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 8px 20px rgba(79, 70, 229, .25);
    }

    .nav-note {
      color: var(--muted);
      font-size: .92rem;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 48px 22px 76px;
    }

    .welcome-card {
      width: min(760px, 100%);
      padding: clamp(32px, 7vw, 68px);
      text-align: center;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 30px;
      box-shadow: 0 24px 80px rgba(51, 65, 85, .12);
      backdrop-filter: blur(14px);
      animation: appear .7s ease-out both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      padding: 8px 14px;
      border: 1px solid #ddd6fe;
      border-radius: 999px;
      color: #5b21b6;
      background: #f5f3ff;
      font-size: .85rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 4.6rem);
      line-height: 1.05;
      letter-spacing: -.065em;
    }

    h1 span {
      display: block;
      color: var(--primary);
    }

    .description {
      max-width: 520px;
      margin: 24px auto 30px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.8;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 23px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    button:hover { transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 4px; }

    .primary-btn {
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 10px 24px rgba(79, 70, 229, .25);
    }

    .primary-btn:hover { box-shadow: 0 14px 30px rgba(79, 70, 229, .32); }

    .secondary-btn {
      color: #4338ca;
      background: #eef2ff;
    }

    #message {
      min-height: 28px;
      margin-top: 22px;
      color: #4338ca;
      font-weight: 600;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #64748b;
      font-size: .85rem;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 480px) {
      header { padding: 18px; }
      .nav-note { display: none; }
      main { padding: 28px 16px 48px; }
      .welcome-card { border-radius: 22px; }
      .actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">✦</div>
      <span>My App</span>
    </div>
    <div class="nav-note">A little something made for you</div>
  </header>

  <main>
    <section class="welcome-card" aria-labelledby="welcome-title">
      <div class="eyebrow"><span aria-hidden="true">✧</span> YOUR NEXT CHAPTER STARTS HERE</div>
      <h1 id="welcome-title">Welcome to <span>My App!</span></h1>
      <p class="description">
        We’re glad you’re here. Discover a fresh, simple way to get started
        and make the most of your experience.
      </p>
      <div class="actions">
        <button class="primary-btn" id="startBtn" type="button">Get Started&nbsp; →</button>
        <button class="secondary-btn" id="learnBtn" type="button">Learn More</button>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer>© <span id="year"></span> My App. Made with care.</footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    document.getElementById("startBtn").addEventListener("click", function () {
      document.getElementById("message").textContent =
        "You're all set! Add your app's next step here.";
    });

    document.getElementById("learnBtn").addEventListener("click", function () {
      document.getElementById("message").textContent =
        "Welcome! Customize this page with details about what your app does.";
    });
  </script>
</body>
</html>
